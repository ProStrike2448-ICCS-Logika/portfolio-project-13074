<header class="border-bottom lh-1 py-3">
  <div class="row flex-nowrap justify-content-between align-items-center">
    <div class="col-4 pt-1">
      <a class="icon-link icon-link-hover link-underline link-underline-opacity-0 link-dark"
         style="--bs-link-hover-color-rgb: 25, 135, 84"
         href="{% url 'blog:post_create' %}">
        <svg xmlns="http://www.w3.org/2000/svg"
             width="24"
             height="24"
             fill="none"
             viewBox="0 0 24 24">
          <path fill="currentColor" d="M14 4a.5.5 0 0 0 0-1zm7 6a.5.5 0 0 0-1 0zm-7-7H4v1h10zM3 4v16h1V4zm1 17h16v-1H4zm17-1V10h-1v10zm-1 1a1 1 0 0 0 1-1h-1zM3 20a1 1 0 0 0 1 1v-1zM4 3a1 1 0 0 0-1 1h1z">
          </path>
          <path stroke="currentColor" d="m17.5 4.5-8.458 8.458a.25.25 0 0 0-.06.098l-.824 2.47a.25.25 0 0 0 .316.316l2.47-.823a.25.25 0 0 0 .098-.06L19.5 6.5m-2-2 2.323-2.323a.25.25 0 0 1 .354 0l1.646 1.646a.25.25 0 0 1 0 .354L19.5 6.5m-2-2 2 2">
          </path>
        </svg>
      Писати</a>
    </div>
    <div class="col-4 text-center">
      <a class="blog-header-logo text-body-emphasis text-decoration-none"
         href="#">Blog</a>
    </div>
    <div class="col-4 d-flex justify-content-end align-items-center gap-3">
      {% if user.is_authenticated %}
        <span>Вітаю, {{ user.username }}</span>
        <form action="{% url 'auth_system:logout' %}" method="post">
          {% csrf_token %}
          <input class="btn btn-sm btn-outline-danger" type="submit" value="Logout">
        </form>
      {% else %}
        <a class="btn btn-sm btn-outline-primary"
           href="{% url 'auth_system:login' %}">Login</a>
        <a class="btn btn-sm btn-outline-secondary"
           href="{% url 'auth_system:register' %}">Register</a>
      {% endif %}
    </div>
  </div>
  <nav>
  </nav>
</header>
