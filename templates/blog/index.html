{% extends "../base.html" %}
{% block content %}
  <h1 class="border-bottom mt-4">Нові записи</h1>
  <div class="post-container row row-cols-md-3 g-4">{% include "blog/post_list.html" %}</div>
  <div class="d-grid gap-2 col-6 mt-5 mx-auto">
    <button class="btn btn-outline-primary" onClick="showMore()">Показати ще</button>
  </div>
  <nav aria-label="Page navigation">
    <ul class="pagination justify-content-center mt-3">
      <li class="page-item {% if not page_obj.has_previous %}disabled{% endif %}">
        <a class="page-link"
           {% if page_obj.has_previous %}href="?page={{ page_obj.previous_page_number }}"{% endif %}
           aria-label="Previous">
          <span aria-hidden="true">«</span>
        </a>
      </li>
      {% for i in page_obj.paginator.page_range %}
        <li class="page-item {% if page_obj.number == i %}active{% endif %}">
          <a class="page-link" href="?page={{ i }}">{{ i }}</a>
        </li>
      {% endfor %}
      <li class="page-item {% if not page_obj.has_next %}disabled{% endif %}">
        <a class="page-link"
           {% if page_obj.has_next %}href="?page={{ page_obj.next_page_number }}"{% endif %}
           aria-label="Next">
          <span aria-hidden="true">»</span>
        </a>
      </li>
    </ul>
  </nav>
  <input type="hidden"
         name="page-cur"
         id="page-cur"
         value="{{ page_obj.number }}">
  <input type="hidden"
         name="page-num"
         id="page-num"
         value="{{ page_obj.paginator.num_pages }}">
{% endblock content %}
