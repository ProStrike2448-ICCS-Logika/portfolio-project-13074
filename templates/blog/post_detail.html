{% extends "../base.html" %}
{% block content %}
  <h1>{{ post.title }}</h1>
  <p>{{ post.content }}</p>
  <p>{{ post.created_at }}</p>
  <p>{{ post.author }}</p>
  <a href="{% url 'blog:index' %}">Всі пости</a>
  {% if post.author == request.user %}
    <a href="{% url 'blog:post_update' post.pk %}">Оновити</a>
  {% endif %}
{% endblock content %}
